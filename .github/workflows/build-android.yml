name: Build Android APK (OriginOS 6 + Standard)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build OriginOS 6 Widget APK & Standard APK
        working-directory: android
        run: gradle assembleOriginOsRelease assembleStandardRelease --no-daemon

      - name: Prepare and verify APK outputs
        run: |
          mkdir -p android-dist
          cp android/app/build/outputs/apk/originOs/release/app-originOs-release.apk android-dist/AetherMusic-OriginOS-Widget.apk
          cp android/app/build/outputs/apk/standard/release/app-standard-release.apk android-dist/AetherMusic-Standard.apk
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose android-dist/AetherMusic-OriginOS-Widget.apk
            "$APKSIGNER" verify --verbose android-dist/AetherMusic-Standard.apk
          fi

      - name: Upload Android APKs (Actions Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: AetherMusic-Android-APKs
          path: |
            android-dist/AetherMusic-OriginOS-Widget.apk
            android-dist/AetherMusic-Standard.apk

      - name: Publish direct APK download to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest \
              android-dist/AetherMusic-OriginOS-Widget.apk \
              android-dist/AetherMusic-Standard.apk \
              --clobber
          else
            gh release create android-latest \
              android-dist/AetherMusic-OriginOS-Widget.apk \
              android-dist/AetherMusic-Standard.apk \
              --title "Aether Music Android (Latest)" \
              --notes "Прямые APK-файлы без ZIP-архива. Для встроенного виджета OriginOS 6 скачайте AetherMusic-OriginOS-Widget.apk (удалив официальный Spotify). Если нужен официальный Spotify — скачайте AetherMusic-Standard.apk."
          fi
