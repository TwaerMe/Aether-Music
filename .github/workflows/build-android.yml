name: Build Android APK (OriginOS 6 + Standard)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build OriginOS 6 Widget APK & Standard APK
        working-directory: android
        run: gradle assembleOriginOsRelease assembleStandardRelease --no-daemon

      - name: Prepare APK outputs
        run: |
          mkdir -p android-dist
          cp android/app/build/outputs/apk/originOs/release/app-originOs-release.apk android-dist/AetherMusic-OriginOS-Widget.apk
          cp android/app/build/outputs/apk/standard/release/app-standard-release.apk android-dist/AetherMusic-Standard.apk

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: AetherMusic-Android-APKs
          path: |
            android-dist/AetherMusic-OriginOS-Widget.apk
            android-dist/AetherMusic-Standard.apk
