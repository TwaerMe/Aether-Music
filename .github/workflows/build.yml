name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: pyinstaller --noconfirm --onefile --windowed --collect-all customtkinter --collect-all imageio_ffmpeg --collect-all sounddevice --collect-all _sounddevice_data --collect-all yt_dlp --collect-all certifi --name "AetherPlayer" main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherPlayer-Windows
          path: dist/AetherPlayer.exe
